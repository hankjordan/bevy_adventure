[package]
name = "bevy_adventure"
version = "0.6.0"
edition = "2024"
description = "A framework for building adventure games in Bevy."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hankjordan/bevy_adventure"

[features]
default = []
serde = ["dep:serde", "bevy/serialize"]

[dev-dependencies]
bevy = { version = "0.18" }
bevy-inspector-egui = "0.36"

[dependencies]
bevy = { version = "0.18" }
bevy_rapier3d = { git = "https://github.com/Buncys/bevy_rapier.git", branch = "bevy-0.18.0" }
serde = { version = "1.0.228", optional = true }
