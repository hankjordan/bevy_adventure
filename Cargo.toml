[package]
name = "bevy_adventure"
version = "0.6.0"
edition = "2024"
description = "A framework for building adventure games in Bevy."
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/hankjordan/bevy_adventure"

[features]
default = []
serde = ["dep:serde", "bevy/serialize"]

[dev-dependencies]
bevy = { version = "0.18", features = ["jpeg"] }
bevy-inspector-egui = "0.21"

[dependencies]
bevy = { version = "0.18", default-features = false, features = ["gltf_animation", "bevy_audio"] }
bevy_rapier3d = "0.23"
serde = { version = "1.0", optional = true }
